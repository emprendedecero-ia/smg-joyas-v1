<!doctype html>
<html lang="es"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>SMG Joyas | Administración</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="styles.css" /></head>
<body class="admin-page"><header class="admin-header"><a href="/" class="brand"><img src="logo.png" alt="SMG Joyas" /></a><a href="/" class="secondary-button">Ver tienda</a></header><main class="admin-main"><section class="admin-intro"><p class="eyebrow">Panel interno</p><h1>Productos</h1><p>Creá, editá, desactivá productos y actualizá precios.</p></section><section class="admin-login" id="admin-login"><label>Clave de administración<input id="admin-key" type="password" autocomplete="current-password" /></label><button id="login-button" class="primary-button">Ingresar</button></section><section id="admin-content" hidden><form class="product-form" id="product-form"><input id="product-id" type="hidden" /><label>Código<input id="form-code" required /></label><label>Nombre<input id="form-name" required /></label><label>Categoría<input id="form-category" required placeholder="Anillos" /></label><label>Precio<input id="form-price" type="number" min="0" step="0.01" required /></label><label>URL de imagen<input id="form-image-url" placeholder="https://... o COD.png" /></label><label class="checkbox-field"><input id="form-active" type="checkbox" checked /> Visible en tienda</label><div class="form-actions"><button type="button" id="form-cancel" class="secondary-button">Cancelar</button><button class="primary-button" id="form-submit">Guardar producto</button></div></form><div class="admin-list-header"><h2>Catálogo</h2><input id="admin-search" type="search" placeholder="Buscar por código o nombre" /></div><div class="admin-table-wrap"><table><thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Precio</th><th>Estado</th><th></th></tr></thead><tbody id="admin-products"></tbody></table></div></section></main><script src="admin.js"></script></body></html>
