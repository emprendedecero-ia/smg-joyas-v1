services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smg
      POSTGRES_PASSWORD: smg_dev
      POSTGRES_DB: smgjoyeria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smg -d smgjoyeria"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://smg:smg_dev@db:5432/smgjoyeria
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGIN: http://localhost:3000
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./products-assets:/app/products-assets:ro
      - ./bijou.xlsx:/app/bijou.xlsx:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WHATSAPP_NUMBER: "5491126151141"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WHATSAPP_NUMBER: "5491126151141"
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
